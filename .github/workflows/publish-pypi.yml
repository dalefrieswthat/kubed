# Publish the Python package to PyPI when a release is published.
# Trigger: create a new Release (and tag) in GitHub → Actions runs and publishes to PyPI.
# Requires:
#   - setup.py or pyproject.toml in the repo (package must be buildable).
#   - PyPI API token: add repository secret PYPI_API_TOKEN (https://pypi.org/manage/account/token/).

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build
        # If you use setup.py only (no pyproject.toml), ensure setuptools is available:
        # run: pip install setuptools wheel && python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
